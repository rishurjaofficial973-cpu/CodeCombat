server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: codeduel-backend
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:codedueldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3000ms

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/codeduel?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3000ms

---
# Application Custom Properties
codeduel:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  matchmaking:
    rating-window-initial: 50
    rating-window-step-10s: 100
    rating-window-step-20s: 200
    rating-window-step-30s: 500
    poll-interval-ms: 1000
    queue-timeout-seconds: 120
  versus:
    countdown-seconds: 3
    default-match-time-seconds: 900 # 15 minutes
    disconnect-grace-seconds: 30
  scoring:
    correctness-weight: 600
    runtime-weight: 200
    memory-weight: 100
    speed-weight: 100
    total-score: 1000
  judge:
    default-time-limit-ms: 2000
    default-memory-limit-mb: 256
    execution-timeout-ms: 5000
    sandbox-temp-dir: ${SANDBOX_TEMP_DIR:./judge-sandbox}
  seeder:
    enabled: true
    total-problems: 1000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
